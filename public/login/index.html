<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – iTales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            background-image: url('/assets/gedung.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(94, 137, 115, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .login-logo img {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
        }

        .login-logo h1 {
            color: #0b4928;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 14px;
            color: #333;
        }

        .input-group input::placeholder {
            color: #888;
        }

        .captcha-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 30px;
            gap: 15px;
        }

        .captcha-box {
            background: white;
            flex: 0 0 auto;
            white-space: nowrap;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #111;
        }

        .captcha-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 16px;
        }
        
        .captcha-input::placeholder {
            color: #888;
        }

        .error-msg {
            width: 100%;
            background: rgba(255,80,80,0.15);
            border: 1.5px solid rgba(255,100,100,0.4);
            color: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13.5px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }

        .btn-login {
            background: #2312d8;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(35, 18, 216, 0.3);
        }

        .btn-login:hover {
            background: #1c0eaa;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(35, 18, 216, 0.4);
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-overlay"></div>

    <div class="login-container">
        
        <div class="login-logo">
            <img src="/assets/Logo_uin.png" alt="Logo UINSSC">
            <h1>iTales</h1>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <form action="/login" method="POST" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username..." required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password..." required>
            </div>

            <div class="captcha-group">
                <div class="captcha-box" id="captcha-display">
                    3 + 4 =
                </div>
                <input type="text" name="captcha" id="captcha-input" class="captcha-input" placeholder="..." required>
            </div>

            <button type="submit" class="btn-login">LOGIN</button>
        </form>

    </div>

    <script>
        // Generate random math captcha (angka kecil 1-9)
        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 9) + 1;
            const num2 = Math.floor(Math.random() * 9) + 1;
            document.getElementById('captcha-display').innerText = `${num1} + ${num2} =`;
            // Store the answer in a data attribute to validate before submit if needed
            document.getElementById('captcha-display').dataset.answer = num1 + num2;
        }

        // Validate captcha before submit
        document.querySelector('form').addEventListener('submit', function(e) {
            const answer = document.getElementById('captcha-display').dataset.answer;
            const input = document.getElementById('captcha-input').value;
            if (parseInt(input) !== parseInt(answer)) {
                e.preventDefault();
                alert('Captcha salah, silakan coba lagi!');
                generateCaptcha();
                document.getElementById('captcha-input').value = '';
            } else {
                sessionStorage.removeItem('kpalya_logged_out');
            }
        });

        // Tampilkan error dari server jika ada
        const params = new URLSearchParams(window.location.search);
        const errorMsg = params.get('error');
        if (errorMsg) {
            const el = document.getElementById('error-msg');
            el.textContent = decodeURIComponent(errorMsg);
            el.style.display = 'block';
        }

        // Generate on load
        window.onload = generateCaptcha;
    </script>
</body>
</html>
